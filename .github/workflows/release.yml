name: Release

# Obsidian's community-plugin installer pulls main.js / manifest.json /
# styles.css from the release assets of the tag named exactly after
# manifest.json's version (no "v" prefix). Tag 0.1.0 -> release 0.1.0.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # What signing the assets costs: an OIDC token, which is the runner's own
      # identity, and write access to the repository's attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Fail if the tag and manifest version disagree
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          [ "$manifest" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != manifest $manifest"; exit 1; }
      # main.js is a bundle nobody can read and styles.css ships verbatim, so a
      # reader downloading either has no way to tell it came from this source.
      # The attestation is that way: it binds each file's digest to this
      # workflow, this commit and this runner, and
      #   gh attestation verify main.js --repo kiycoh/obsidian-silica
      # checks it. Before the upload, so a release is never published carrying an
      # asset that failed to get one.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
      # Published, not draft: the installer ignores drafts, and `gh release edit
      # <tag>` cannot even reach one (that lookup resolves published tags only),
      # so a draft just adds a manual step that fails in a confusing way.
      # --notes-from-tag: the release note is the annotated tag's own message,
      # so it is written once, at the moment the tag is cut, and travels with
      # it. Tag annotated or this step fails rather than publishing an empty
      # release.
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-from-tag main.js manifest.json styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
